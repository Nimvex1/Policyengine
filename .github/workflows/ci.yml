name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge fmt --check
      - run: forge build
      - run: forge test
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install slither
        run: pip install slither-analyzer==0.11.6
      - name: Run slither (informational)
        run: slither . --filter-paths "lib/|test/|script/" --exclude-dependencies --fail-none
